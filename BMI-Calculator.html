<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online BMI calculator tool. Calculate your Body Mass Index and understand your weight category.">
  <meta name="keywords" content="BMI calculator, body mass index, weight calculator, health calculator, fitness tool">

  <meta property="og:title" content="BMI Calculator - Calculate Your Body Mass Index | Toollaxy">
  <meta property="og:description" content="Free online tool to calculate your BMI and understand your weight category.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://toollaxy.com/bmi-calculator">
  <meta property="og:image" content="https://toollaxy.com/images/bmi-calculator-og.jpg">
  <link rel="canonical" href="https://toollaxy.com/bmi-calculator">
  <title>BMI Calculator - Calculate Your Body Mass Index | Toollaxy</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary-blue: #2563eb;
      --dark-blue: #1e40af;
      --light-blue: #93c5fd;
      --bg-gray: #f8fafc;
      --text-dark: #1e293b;
      --text-light: #64748b;
      --white: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --rounded: 8px;
      --transition: all 0.3s ease;
      --success-green: #10b981;
      --warning-orange: #f59e0b;
      --danger-red: #dc2626;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      background-color: var(--white);
      box-shadow: var(--shadow);
      padding: 15px 0;
    }
    
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-blue);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo span {
      color: var(--text-dark);
    }
    
    .logo i {
      font-size: 28px;
    }
    
    .breadcrumb {
      padding: 15px 0;
      font-size: 0.9rem;
      color: var(--text-light);
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 20px;
    }
    
    .breadcrumb a {
      color: var(--primary-blue);
      text-decoration: none;
      transition: var(--transition);
    }
    
    .breadcrumb a:hover {
      text-decoration: underline;
    }
    
    .breadcrumb span {
      margin: 0 5px;
      color: var(--text-light);
    }
    
    main {
      flex: 1;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .tool-container {
      background-color: var(--white);
      border-radius: var(--rounded);
      box-shadow: var(--shadow);
      padding: 30px;
      margin-bottom: 40px;
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: var(--text-dark);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    
    h1 i {
      color: var(--primary-blue);
    }
    
    .tool-description {
      color: var(--text-light);
      margin-bottom: 30px;
      line-height: 1.6;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
      text-align: left;
    }
    
    .input-unit {
      position: relative;
    }
    
    .input-unit input {
      width: 100%;
      padding: 12px 15px;
      font-size: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: var(--rounded);
      background-color: var(--white);
      transition: var(--transition);
    }
    
    .input-unit input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    
    .unit {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
    }
    
    button {
      padding: 14px 20px;
      background-color: var(--primary-blue);
      color: var(--white);
      border: none;
      border-radius: var(--rounded);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    
    button:hover {
      background-color: var(--dark-blue);
      box-shadow: var(--shadow-hover);
    }
    
    button i {
      font-size: 18px;
    }
    
    .result-container {
      margin-top: 30px;
      padding: 20px;
      border-radius: var(--rounded);
      text-align: center;
      display: none;
    }
    
    .bmi-value {
      font-size: 3rem;
      font-weight: 700;
      margin: 10px 0;
    }
    
    .bmi-category {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding: 10px;
      border-radius: var(--rounded);
    }
    
    .underweight {
      background-color: #dbeafe;
      color: var(--primary-blue);
    }
    
    .normal {
      background-color: #dcfce7;
      color: var(--success-green);
    }
    
    .overweight {
      background-color: #fef3c7;
      color: var(--warning-orange);
    }
    
    .obese {
      background-color: #fee2e2;
      color: var(--danger-red);
    }
    
    .bmi-scale {
      display: flex;
      margin-top: 20px;
      border-radius: var(--rounded);
      overflow: hidden;
      height: 30px;
    }
    
    .scale-segment {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--white);
    }
    
    .scale-underweight {
      background-color: var(--primary-blue);
    }
    
    .scale-normal {
      background-color: var(--success-green);
    }
    
    .scale-overweight {
      background-color: var(--warning-orange);
    }
    
    .scale-obese {
      background-color: var(--danger-red);
    }
    
    .scale-marker {
      position: relative;
      height: 40px;
      margin-top: 5px;
    }
    
    .marker {
      position: absolute;
      bottom: 0;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 15px solid var(--text-dark);
    }
    
    .marker-label {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .error-message {
      color: var(--danger-red);
      background-color: #fee2e2;
      padding: 12px 15px;
      border-radius: var(--rounded);
      margin-top: 20px;
      display: none;
    }
    
    footer {
      background-color: var(--text-dark);
      color: var(--white);
      padding: 40px 0 20px;
      text-align: center;
    }
    
    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    .footer-logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 15px;
      display: inline-block;
      text-decoration: none;
    }
    
    .footer-logo span {
      color: var(--light-blue);
    }
    
    .footer-copyright {
      opacity: 0.8;
      font-size: 0.9rem;
      margin-top: 20px;
    }
    
    .footer-copyright a {
      color: var(--white);
      text-decoration: none;
      transition: var(--transition);
    }
    
    .footer-copyright a:hover {
      color: var(--light-blue);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }
      
      .tool-container {
        padding: 20px;
      }
      
      .bmi-value {
        font-size: 2.5rem;
      }
      
      .bmi-category {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <i class="fas fa-tools"></i>
        <span>TOOL<span>LAXY</span></span>
      </a>
    </div>
  </header>
  
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span>/</span>
    <span>BMI Calculator</span>
  </div>
  
  <main>
    <div class="tool-container">
      <h1><i class="fas fa-weight"></i> BMI Calculator</h1>
      <p class="tool-description">
        Body Mass Index (BMI) is a measure of body fat based on height and weight.
      </p>
      
      <div class="form-group">
        <label for="weight">Weight</label>
        <div class="input-unit">
          <input type="number" id="weight" placeholder="Enter your weight" step="0.1" min="0">
          <span class="unit">kg</span>
        </div>
      </div>
      
      <div class="form-group">
        <label for="height">Height</label>
        <div class="input-unit">
          <input type="number" id="height" placeholder="Enter your height" step="0.1" min="0">
          <span class="unit">cm</span>
        </div>
      </div>
      
      <button onclick="calculateBMI()">
        <i class="fas fa-calculator"></i>
        Calculate BMI
      </button>
      
      <div id="errorMessage" class="error-message"></div>
      
      <div id="resultContainer" class="result-container">
        <div>Your BMI is</div>
        <div id="bmiValue" class="bmi-value">0</div>
        <div id="bmiCategory" class="bmi-category">Category</div>
        
        <div class="bmi-scale">
          <div class="scale-segment scale-underweight">Underweight<br>&lt;18.5</div>
          <div class="scale-segment scale-normal">Normal<br>18.5-24.9</div>
          <div class="scale-segment scale-overweight">Overweight<br>25-29.9</div>
          <div class="scale-segment scale-obese">Obese<br>30+</div>
        </div>
        
        <div class="scale-marker">
          <div id="bmiMarker" class="marker" style="left: 0%;"></div>
          <div id="bmiMarkerLabel" class="marker-label"></div>
        </div>
      </div>
    </div>
  </main>
  
  <footer>
    <div class="footer-container">
      <a href="index.html" class="footer-logo">Toollaxy<span></span></a>
      <div class="footer-copyright">
        © 2025 Toollaxy. All rights reserved. 
        <a href="privacy.html">Privacy Policy</a> | 
        <a href="terms.html">Terms of Service</a>
      </div>
    </div>
  </footer>
  
  <script>
    function calculateBMI() {
      const weightInput = document.getElementById('weight');
      const heightInput = document.getElementById('height');
      const errorMessage = document.getElementById('errorMessage');
      const resultContainer = document.getElementById('resultContainer');
      const bmiValue = document.getElementById('bmiValue');
      const bmiCategory = document.getElementById('bmiCategory');
      const bmiMarker = document.getElementById('bmiMarker');
      const bmiMarkerLabel = document.getElementById('bmiMarkerLabel');
      
      // Reset previous results and errors
      errorMessage.style.display = 'none';
      resultContainer.style.display = 'none';
      
      // Get input values
      const weight = parseFloat(weightInput.value);
      const height = parseFloat(heightInput.value);
      
      // Validate inputs
      if (!weight || !height || weight <= 0 || height <= 0) {
        errorMessage.textContent = 'Please enter valid weight and height values.';
        errorMessage.style.display = 'block';
        return;
      }
      
      // Calculate BMI
      const heightInMeters = height / 100;
      const bmi = weight / (heightInMeters * heightInMeters);
      const roundedBMI = bmi.toFixed(1);
      
      // Determine category
      let category = '';
      let categoryClass = '';
      
      if (bmi < 18.5) {
        category = 'Underweight';
        categoryClass = 'underweight';
      } else if (bmi < 25) {
        category = 'Normal weight';
        categoryClass = 'normal';
      } else if (bmi < 30) {
        category = 'Overweight';
        categoryClass = 'overweight';
      } else {
        category = 'Obese';
        categoryClass = 'obese';
      }
      
      // Update results
      bmiValue.textContent = roundedBMI;
      bmiCategory.textContent = category;
      bmiCategory.className = 'bmi-category ' + categoryClass;
      
      // Position marker on scale
      let markerPosition = 0;
      if (bmi < 18.5) {
        markerPosition = (bmi / 18.5) * 25;
      } else if (bmi < 25) {
        markerPosition = 25 + ((bmi - 18.5) / (25 - 18.5)) * 25;
      } else if (bmi < 30) {
        markerPosition = 50 + ((bmi - 25) / (30 - 25)) * 25;
      } else {
        markerPosition = 75 + (Math.min(bmi - 30, 20) / 20) * 25;
      }
      
      // Cap at 100% for very high BMI values
      markerPosition = Math.min(markerPosition, 98);
      
      bmiMarker.style.left = `${markerPosition}%`;
      bmiMarkerLabel.textContent = roundedBMI;
      bmiMarkerLabel.style.left = `${markerPosition}%`;
      
      // Show results
      resultContainer.style.display = 'block';
      
      // Scroll to results
      resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    // Calculate BMI when Enter key is pressed
    document.getElementById('weight').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        calculateBMI();
      }
    });
    
    document.getElementById('height').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        calculateBMI();
      }
    });
  </script>
</body>
</html>
